title: Unauthorized Sudo Command Execution
id: a1b2c3d4-0004-4000-8000-000000000004
status: experimental

logsource:
    product: linux
    service: auth

detection:
    selection_command:
        message|contains: 'COMMAND='

    selection_sudo:
        message|contains: 'sudo'

    condition: selection_command and selection_sudo

level: medium