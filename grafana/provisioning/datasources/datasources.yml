apiVersion: 1

datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    jsonData:
      maxLines: 1000

  - name: Prometheus-VMAlert
    type: prometheus
    access: proxy
    url: http://vmalert:8880
    isDefault: false