version: '3.8'

networks:
  monitoring_net:
    driver: bridge

volumes:
  vmlogs_data:

services:
  # 1. Sigma Rules Auto-Converter Engine
  sigma-converter:
    build:
      context: ./sigma/converter
    volumes:
      - ./sigma/rules:/app/rules
      - ./vmalert/generated_rules:/vmalert/generated_rules
    restart: "no"

  # 2. Centralized VictoriaLogs Storage
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    ports:
      - "9428:9428"
    volumes:
      - vmlogs_data:/vlogs-data
    command:
      - "-storageDataPath=/vlogs-data"
      - "-httpListenAddr=:9428"
    networks:
      - monitoring_net

  # 3. Fluentd Normalization Engine
  fluentd:
    build:
      context: ./fluentd
    container_name: fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluentd/conf:/fluentd/etc
    environment:
      - FLUENTD_CONF=fluent.conf
    depends_on:
      - victorialogs
    networks:
      - monitoring_net

  # 4. Victoria Metrics for Metrics Collection
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    networks:
      - monitoring_net

  # 5. VMAlert Detection Engine
  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: vmalert
    ports:
      - "8880:8880"
    volumes:
      - ./vmalert/generated_rules:/vmalert/generated_rules
    depends_on:
      sigma-converter:
        condition: service_completed_successfully
      victorialogs:
        condition: service_started
      victoriametrics:
        condition: service_started
    command:
      - "-rule=/vmalert/generated_rules/vmalert_rules.yml"
      - "-rule.defaultRuleType=vlogs"
      - "-datasource.url=http://victorialogs:9428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-notifier.blackhole=true"
      - "-evaluationInterval=10s"
    networks:
      - monitoring_net

  # 6. Grafana Dashboard & Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=ey.mazi233@gmail.com
      - GF_SMTP_PASSWORD=ewppkakasilvnkmn
      - GF_SMTP_FROM_ADDRESS=ey.mazi233@gmail.com
      - GF_SMTP_FROM_NAME=Security Pipeline Alerts
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - victorialogs
      - victoriametrics
      - vmalert
    networks:
      - monitoring_net

  # 7. React Vite Custom Operations Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: logging-dashboard
    ports:
      - "5173:80"
    environment:
      - VITE_VICTORIALOGS_URL=http://localhost:9428
      - VITE_SUPABASE_URL=https://your-supabase-project.supabase.co
      - VITE_SUPABASE_ANON_KEY=your-supabase-anon-key
    depends_on:
      - victorialogs
    networks:
      - monitoring_net