groups:
  - name: sigma_detection_rules
    type: vlogs
    interval: 10s
    rules:
      # Sigma: Failed SSH Brute Force Detection
      - alert: LinuxSSHBruteForce
        expr: 'message: "Failed password" | stats count() as failed_attempts by (host) | filter failed_attempts > 5'
        for: 1m
        labels:
          severity: high
          category: threat_detection
        annotations:
          summary: "Possible SSH Brute Force on {{ $labels.host }}"
          description: "Over 5 failed login attempts detected in a 1-minute window."

      # Sigma: Suspicious Process Execution (Windows Event ID 4688)
      - alert: WindowsSuspiciousProcess
        expr: 'log_source: "windows_eventlog" AND event_id: 4688 AND (message: "cmd.exe" OR message: "powershell.exe")'
        for: 0s
        labels:
          severity: medium
          category: threat_detection
        annotations:
          summary: "Command Shell Executed on {{ $labels.host }}"
          description: "Suspicious command interpreter spawned."