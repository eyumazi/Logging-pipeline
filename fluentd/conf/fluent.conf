<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>



# 2. NORMALIZE WINDOWS EVENT LOGS

<filter win.eventlog>
  @type record_transformer
  enable_ruby true
  <record>
    os_type windows
    host ${record["ComputerName"] || "windows-host"}
    log_source windows_eventlog
    severity ${record["EventType"] || "info"}
    event_id ${record["EventID"] ? record["EventID"].to_s : "0"}
    message ${record["Message"] || record["StringInserts"] || record["log"] || ""}
    normalized_at ${Time.now.utc.iso8601}
  </record>
</filter>



# 3. NORMALIZE LINUX SYSLOG


<filter linux.syslog>
  @type record_transformer
  enable_ruby true

  <record>
    os_type linux
    host ${record["host"] || "linux-host"}
    log_source linux_syslog
    severity ${record["pri"] || "info"}
    event_id ${record["event_id"] || "0"}
    message ${record["message"] || record["log"] || ""}
    normalized_at ${Time.now.utc.iso8601}
  </record>
</filter>



# 4. NORMALIZE LINUX AUTHENTICATION LOGS


<filter linux.auth>
  @type record_transformer
  enable_ruby true

  <record>
    os_type linux
    host ${record["host"] || "linux-host"}
    log_source linux_auth
    severity ${record["pri"] || "info"}
    event_id ${record["event_id"] || "0"}
    message ${record["message"] || record["log"] || ""}
    normalized_at ${Time.now.utc.iso8601}
  </record>
</filter>



# 5. SEND NORMALIZED LOGS TO VICTORIALOGS


<match **>
  @type http
  endpoint http://victorialogs:9428/insert/jsonline?_stream_fields=os_type,log_source&_time_field=normalized_at&_msg_field=message
  open_timeout 2

  <format>
    @type json
  </format>

  <buffer>
    @type memory
    flush_interval 2s
  </buffer>
</match>