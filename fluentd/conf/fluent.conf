# 1. Listen for forward protocol from agents
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# 2. Normalize Windows Logs
<filter raw.windows>
  @type record_transformer
  enable_ruby true
  <record>
    @timestamp ${record["TimeGenerated"] || Time.now.utc.iso8601}
    host ${record["ComputerName"] || "windows-host"}
    log_source "windows_eventlog"
    severity ${record["EventType"] || "info"}
    event_id ${record["EventID"]}
    message ${record["Message"] || record["StringInserts"]}
  </record>
</filter>

# 3. Normalize Linux Logs
<filter raw.linux>
  @type record_transformer
  enable_ruby true
  <record>
    @timestamp ${Time.now.utc.iso8601}
    host ${record["host"] || "ubuntu-vm"}
    log_source "linux_syslog"
    severity ${record["pri"] || "info"}
    event_id 0
    message ${record["log"] || record["message"]}
  </record>
</filter>

# 4. Unify Tag & Final Schema Formatting
<match raw.**>
  @type rewrite_tag_filter
  <rule>
    key log_source
    pattern ^(.+)$
    tag normalized.logs
  </rule>
</match>

# 5. Output Normalized JSON to VictoriaLogs
<match normalized.logs>
  @type victorialogs
  url http://victorialogs:9428/insert/jsonline?_stream_fields=host,log_source,severity
</match>