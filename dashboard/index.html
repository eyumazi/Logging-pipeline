<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Logging pipeline security operations dashboard">
    <title>Logging Pipeline Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">SECURITY OPERATIONS</p>
                <h1>Logging Pipeline</h1>
                <p class="subtitle">Normalized events and Sigma detections from VictoriaLogs</p>
            </div>
            <div class="actions">
                <span id="connection-status" class="status status-loading">Connecting</span>
                <button id="refresh-button" type="button">Refresh</button>
            </div>
        </header>

        <section class="metrics" aria-label="Log metrics">
            <article class="metric-card">
                <span class="metric-label">Events loaded</span>
                <strong id="event-count">--</strong>
            </article>
            <article class="metric-card">
                <span class="metric-label">Critical / high</span>
                <strong id="high-count">--</strong>
            </article>
            <article class="metric-card">
                <span class="metric-label">Windows</span>
                <strong id="windows-count">--</strong>
            </article>
            <article class="metric-card">
                <span class="metric-label">Linux</span>
                <strong id="linux-count">--</strong>
            </article>
        </section>

        <section class="panel">
            <div class="panel-heading">
                <div>
                    <h2>Recent events</h2>
                    <p id="last-updated">Waiting for the first query</p>
                </div>
                <label class="search">
                    <span class="sr-only">Filter events</span>
                    <input id="search-input" type="search" placeholder="Filter events">
                </label>
            </div>
            <div id="error-message" class="error" role="alert" hidden></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Severity</th>
                            <th>Source</th>
                            <th>Host</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="event-table">
                        <tr><td class="empty" colspan="5">Loading events...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
